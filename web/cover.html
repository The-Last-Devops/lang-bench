<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lang-bench — cover</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=JetBrains+Mono:wght@700;800&display=swap">
<style>
*{box-sizing:border-box;}
html,body{margin:0;height:100%;background:#0B0E13;color:#E7ECF3;
  font-family:'Barlow Semi Condensed',system-ui,sans-serif;}
#wrap{position:fixed;inset:0;display:grid;place-items:center;padding:20px 20px 76px;}
canvas{width:auto;height:auto;max-width:calc(100vw - 40px);max-height:calc(100vh - 96px);
  border-radius:10px;box-shadow:0 20px 70px rgba(0,0,0,.6);}
.bar{position:fixed;left:0;right:0;bottom:0;height:60px;display:flex;gap:8px;align-items:center;
  justify-content:center;background:#0B0E13;border-top:1px solid #1b2028;}
.bar button{font:600 14px 'Barlow Semi Condensed',sans-serif;letter-spacing:.05em;
  text-transform:uppercase;color:#E7ECF3;background:#141922;border:1px solid #2E3746;
  border-radius:8px;padding:9px 18px;cursor:pointer;}
.bar button[data-on="1"]{background:#E7ECF3;color:#0B0E13;border-color:#E7ECF3;}
.bar #dl{background:#4C8DFF;border-color:#4C8DFF;color:#06101f;font-weight:700;}
.bar span{font:12px 'JetBrains Mono',monospace;color:#6b7688;margin-left:8px;}
</style>
</head>
<body>
<div id="wrap"><canvas id="cv" width="1080" height="1920"></canvas></div>
<div class="bar">
  <button data-v="0">1 · Lanes</button>
  <button data-v="1">2 · Columns</button>
  <button data-v="2">3 · Texture</button>
  <button data-v="3">4 · Type</button>
  <button id="dl">Tải PNG</button>
  <span>1080 &times; 1920</span>
</div>

<script src="./langs.js"></script>
<script>
const W = 1080, H = 1920;
const BG = '#0B0E13', INK = '#E7ECF3', DIM = '#B4C0D0', HAIR = '#222A36';
// Ngôn ngữ và danh sách bài test đều HỎI server, giống màn hình đua: cover là khung hình
// đầu của clip, viết cứng ở đây là ảnh bìa và nội dung clip nói hai chuyện khác nhau.
// Languages and the benchmark list are both ASKED of the server, exactly as the race screen
// does: the cover is the clip's first frame, and hard-coding it makes the cover contradict
// the clip it introduces.
let LANGS = FALLBACK_LANGS;
let BENCHES = [];

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let variant = 0;

const sans = (w, px) => `${w} ${px}px 'Barlow Semi Condensed', sans-serif`;
const mono = (w, px) => `${w} ${px}px 'JetBrains Mono', monospace`;
const rr = (x, y, w, h, r) => { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fill(); };
const bg = () => { ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H); };
// Số bài lấy từ registry, chữ "ngôn ngữ / phiên bản" lấy từ langs.js — cùng một luật với
// câu mở đầu của màn hình đua.
// The count comes from the registry and the "language / version" wording from langs.js —
// the same rule the race screen's opening line follows.
const footLine = () => `${BENCHES.length} BÀI TEST · CÙNG MỘT THUẬT TOÁN`;
const titleLines = () => coverTitle(LANGS);

// Độ dài/độ cao các thanh chỉ là hình trang trí, không phải số đo thật — nên chúng được
// SINH theo số ngôn ngữ, giảm dần, thay vì đọc từ một bảng bốn phần tử viết cứng.
// The bar lengths are decoration, not measurements — so they are GENERATED from the number
// of languages, tapering off, instead of read from a hard-coded table of four.
const taper = (n, hi, lo) => Array.from({ length: n }, (_, i) => (n === 1 ? hi : hi - (hi - lo) * (i / (n - 1))));

const title = (lines, x, y, px, color) => {
  ctx.font = sans(700, px); ctx.fillStyle = color || INK;
  for (const l of lines) { ctx.fillText(l, x, y); y += px * 0.97; }
  return y;
};

/* 1 — LANES. Một làn màu tràn bề ngang cho mỗi ngôn ngữ đang chạy, dài ngắn khác nhau: ở cỡ
   thumbnail thì hình khối và màu đọc được, còn chữ thì không. Đây là thứ quyết định một
   cover TikTok.
   One full-bleed lane per running language, all of different lengths: at thumbnail size the
   shapes and colours read and the words do not, which is what actually decides a TikTok
   cover. */
function lanes() {
  bg();
  const widths = taper(LANGS.length, 1.0, 0.46);
  // Làn co lại khi có nhiều ngôn ngữ, để cả khối vẫn nằm trong vùng an toàn TikTok.
  // Lanes shrink as languages pile up, so the block stays inside TikTok's safe area.
  const lh = Math.min(190, Math.floor(1240 / LANGS.length) - 28);
  const step = lh + Math.max(10, Math.round(lh * 0.15));
  const top = 900 - Math.max(0, (LANGS.length - 4)) * step / 2;
  title(titleLines(), 80, 380, 158);
  let y = Math.max(620, top);
  LANGS.forEach((l, i) => {
    ctx.fillStyle = l.color;
    rr(0, y, (W - 120) * widths[i] + 120, lh, 0);
    ctx.font = sans(700, Math.min(92, Math.round(lh * 0.62)));
    ctx.fillStyle = '#0B0E13';
    ctx.letterSpacing = '3px';
    ctx.fillText(l.label, 80, y + lh * 0.68);
    ctx.letterSpacing = '0px';
    y += step;
  });
  ctx.font = mono(700, 34);
  ctx.fillStyle = DIM;
  ctx.fillText(footLine(), 80, 1840);
}

/* 2 — COLUMNS. Một cột cho mỗi ngôn ngữ, cao thấp khác nhau, như biểu đồ đứng dậy. Cột hẹp
   lại khi có nhiều ngôn ngữ. Khoảng trống trên đầu để chừa chỗ cho avatar và nút của TikTok.
   One standing column per language, of unlike heights — a bar chart on its feet — narrowing
   as languages are added. The space up top is left clear for TikTok's own avatar and
   buttons. */
function columns() {
  bg();
  const heights = taper(LANGS.length, 1080, 560);
  const n = LANGS.length;
  const gap = n > 5 ? 18 : 32;
  const cw = Math.min(200, Math.floor((W - 160 - gap * (n - 1)) / n));
  const x0 = (W - (cw * n + gap * (n - 1))) / 2;
  const base = 1700;
  LANGS.forEach((l, i) => {
    const x = x0 + i * (cw + gap);
    ctx.fillStyle = l.color;
    rr(x, base - heights[i], cw, heights[i], 18);
    ctx.save();
    ctx.translate(x + cw / 2, base - 40);
    ctx.rotate(-Math.PI / 2);
    ctx.font = sans(700, Math.min(74, Math.round(cw * 0.37)));
    ctx.fillStyle = '#0B0E13';
    ctx.letterSpacing = cw < 140 ? '1px' : '4px';
    ctx.textAlign = 'left';
    ctx.fillText(l.label, 0, 26);
    ctx.restore();
    ctx.textAlign = 'left';
    ctx.letterSpacing = '0px';
  });
  title(titleLines(), 80, 340, 132);
  ctx.font = mono(700, 34);
  ctx.fillStyle = DIM;
  ctx.fillText(footLine(), 80, 1840);
}

/* 3 — TEXTURE. Tên mọi bài test trong registry rải thành nền mờ, tiêu đề đè lên. Nhìn ra
   ngay là "có dữ liệu thật ở đây", hợp với người xem kỹ thuật.
   Every benchmark name in the registry laid down as a dim field with the title punched over
   it. It reads as "there is real data here", which is what a technical viewer responds to. */
function texture() {
  bg();
  ctx.font = mono(700, 40);
  ctx.fillStyle = '#182030';
  // Chưa có registry thì bỏ hẳn phần nền: rải chuỗi rỗng ra sẽ thành một trang "undefined".
  // No registry yet means no field at all: laying out empty strings would print a page of
  // "undefined".
  let ty = 120;
  for (let r = 0; BENCHES.length && r < 22; r++) {
    let tx = 40 - (r % 3) * 90;
    while (tx < W) {
      const b = BENCHES[(r * 5 + Math.floor(tx / 100)) % BENCHES.length];
      ctx.fillText(b, tx, ty);
      tx += ctx.measureText(b).width + 46;
    }
    ty += 84;
  }
  ctx.fillStyle = 'rgba(11,14,19,.72)';
  ctx.fillRect(0, 520, W, 900);
  title(titleLines(), 80, 700, 150);
  // Chú giải tự xuống dòng: bốn ngôn ngữ vừa một dòng, tám thì không.
  // The legend wraps: four languages fit one line, eight do not.
  let x = 80, ly = 1262;
  ctx.font = sans(700, 60);
  LANGS.forEach((l) => {
    const w = 50 + ctx.measureText(l.label).width + 56;
    if (x + w > W - 60) { x = 80; ly += 82; }
    ctx.fillStyle = l.color;
    rr(x, ly - 32, 34, 34, 9);
    ctx.font = sans(700, 60);
    ctx.fillStyle = INK;
    ctx.fillText(l.label, x + 50, ly);
    x += w;
  });
}

/* 4 — TYPE. Chữ chiếm gần hết khung, ngôn ngữ gói trong một dòng mono. Đọc được ở cỡ nhỏ
   nhất trong bốn mẫu, nhưng cũng ít thông tin nhất.
   Type fills the frame, the languages collapse into one mono line. The most legible of the
   four when small, and the one that says the least. */
function typeOnly() {
  bg();
  const y = title(['Bài', 'test', 'hiệu', 'năng'], 80, 460, 260);
  ctx.fillStyle = HAIR;
  ctx.fillRect(80, y - 100, W - 160, 4);
  let x = 80, ly = y - 16;
  ctx.font = mono(800, 52);
  LANGS.forEach((l) => {
    const w = 44 + ctx.measureText(l.label).width + 48;
    if (x + w > W - 60) { x = 80; ly += 74; }
    ctx.fillStyle = l.color;
    rr(x, ly - 28, 30, 30, 8);
    ctx.font = mono(800, 52);
    ctx.fillStyle = INK;
    ctx.fillText(l.label, x + 44, ly);
    x += w;
  });
  ctx.font = mono(700, 34);
  ctx.fillStyle = DIM;
  ctx.fillText(footLine(), 80, 1840);
}

const DRAW = [lanes, columns, texture, typeOnly];
function draw() { ctx.clearRect(0, 0, W, H); ctx.textAlign = 'left'; DRAW[variant](); }

document.querySelectorAll('[data-v]').forEach((b) => {
  b.onclick = () => {
    variant = Number(b.dataset.v);
    document.querySelectorAll('[data-v]').forEach((x) => (x.dataset.on = x === b ? '1' : '0'));
    draw();
  };
});
document.getElementById('dl').onclick = () => {
  cv.toBlob((b) => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = `cover-${variant + 1}.png`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }, 'image/png');
};

document.querySelector('[data-v="0"]').dataset.on = '1';
draw();
if (document.fonts?.ready) document.fonts.ready.then(draw);
// Cùng hai nguồn màn hình đua dùng: ngôn ngữ đang chạy (/api/languages) và danh sách bài
// test (/api/registry). Trang cover không có nguồn riêng nào, và không viết cứng gì cả.
// The same two sources the race screen reads: the running languages (/api/languages) and the
// benchmark list (/api/registry). The cover page has no source of its own and hard-codes
// nothing.
(async () => {
  LANGS = await fetchLangs();
  draw();
  try {
    const registry = await (await fetch('/api/registry')).json();
    BENCHES = registry.benchmarks.map((b) => b.id);
    draw();
  } catch {}
})();
</script>
</body>
</html>
